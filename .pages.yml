media:
  input: public/images
  output: /images
  categories: [image]

content:
  - type: group
    name: programacion
    label: Programación
    items:
      - name: eventos
        label: Eventos
        type: file
        path: content/eventos.json
        format: json
        list: true
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: slug
            label: Slug (URL)
            description: Parte de la URL, por ejemplo "noche-de-tango". Solo minúsculas, números y guiones. No cambiar una vez publicado.
            type: string
            required: true
            pattern:
              regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              message: Solo minúsculas, números y guiones.
          - name: description
            label: Descripción corta
            description: Se muestra en las tarjetas de la programación.
            type: text
            required: true
          - name: fullDescription
            label: Descripción completa
            description: Se muestra en la página del evento.
            type: text
            required: true
          - name: image
            label: Imagen
            type: image
            required: true
          - name: calendarDate
            label: Fecha (calendario)
            description: Ordena la programación y marca el día en el calendario.
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: date
            label: Fecha (texto visible)
            description: Como se muestra en el sitio, por ejemplo "12 Sep 2026".
            type: string
            required: true
          - name: time
            label: Horario
            description: Por ejemplo "21:00 hs".
            type: string
            required: true
          - name: eventType
            label: Tipo de evento
            type: select
            required: true
            options:
              values:
                - { value: teatro, label: Teatro }
                - { value: circo, label: Circo }
                - { value: musica, label: Música }
                - { value: feria, label: Feria }
                - { value: variedades, label: Variedades }
          - name: production
            label: Producción
            description: Las producciones de El Bondi se destacan con una estrella.
            type: select
            required: true
            default: externa
            options:
              values:
                - { value: bondi, label: Producción de El Bondi }
                - { value: externa, label: Externa }
          - name: location
            label: Lugar
            type: string
            required: true
            default: El Bondi
          - name: price
            label: Precio
            type: string
            required: true
            default: Contribución sugerida
          - name: contact
            label: Email de contacto
            type: string
            required: true
            default: mailcolectivocultural@gmail.com
          - name: whatsapp
            label: WhatsApp
            type: string
          - name: instagram
            label: Instagram
            type: string

      - name: talleres
        label: Talleres
        type: file
        path: content/talleres.json
        format: json
        list: true
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: slug
            label: Slug (URL)
            description: Parte de la URL, por ejemplo "taller-de-tango". Solo minúsculas, números y guiones. No cambiar una vez publicado.
            type: string
            required: true
            pattern:
              regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              message: Solo minúsculas, números y guiones.
          - name: description
            label: Descripción corta
            type: text
            required: true
          - name: fullDescription
            label: Descripción completa
            type: text
            required: true
          - name: image
            label: Imagen
            type: image
            required: true
          - name: date
            label: Días
            description: El horario semanal lee los días de acá. Usar nombres completos, por ejemplo "Martes" o "Miércoles y Viernes".
            type: string
            required: true
          - name: time
            label: Horario
            description: Por ejemplo "18:00 hs" o "18:00 a 20:00 hs".
            type: string
            required: true
          - name: location
            label: Lugar
            type: string
            required: true
            default: El Bondi
          - name: price
            label: Precio
            type: string
            required: true
            default: Aporte sugerido
          - name: maxParticipants
            label: Cupo máximo
            type: number
          - name: contact
            label: Email de contacto
            type: string
            required: true
            default: mailcolectivocultural@gmail.com
          - name: whatsapp
            label: WhatsApp
            type: string
          - name: instagram
            label: Instagram
            type: string
          - name: instructor
            label: Docente
            type: object
            fields:
              - name: name
                label: Nombre
                type: string
              - name: avatar
                label: Foto
                type: image
              - name: bio
                label: Biografía
                type: text

  - name: flyers
    label: Flyers de inicio
    type: file
    path: content/flyers.json
    format: json
    list: true
    fields:
      - name: src
        label: Flyer
        type: image
        required: true
      - name: alt
        label: Texto alternativo
        description: Describe el flyer para personas que usan lector de pantalla (qué, cuándo, dónde).
        type: text
        required: true
      - name: title
        label: Título
        type: string
        required: true
      - name: caption
        label: Bajada
        type: string
      - name: href
        label: Enlace
        description: Por ejemplo "/evento/slug-del-evento" o "/programacion?categoria=evento".
        type: string
        required: true
      - name: cta
        label: Texto del botón
        type: string
        required: true
        default: Ver el evento

  - name: faq
    label: Preguntas frecuentes
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - name: category
        label: Categoría
        description: Título de la sección, por ejemplo "Sobre El Bondi".
        type: string
        required: true
      - name: questions
        label: Preguntas
        type: object
        list: true
        fields:
          - name: question
            label: Pregunta
            type: string
            required: true
          - name: answer
            label: Respuesta
            type: text
            required: true

  - name: anuncio
    label: Barra de anuncios
    type: file
    path: content/anuncio.json
    format: json
    fields:
      - name: enabled
        label: Mostrar barra
        description: Activala para mostrar el anuncio arriba de todas las páginas. Apagala cuando el anuncio venza.
        type: boolean
        default: false
      - name: highlight
        label: Destacado
        description: Texto en negrita al inicio, por ejemplo "¡Últimas novedades!".
        type: string
      - name: text
        label: Texto
        type: text
      - name: linkLabel
        label: Texto del enlace
        description: Por ejemplo "Más información".
        type: string
      - name: linkHref
        label: Enlace
        description: Por ejemplo "/evento/slug-del-evento" o una URL completa. Si queda vacío no se muestra enlace.
        type: string

  - name: integrantes
    label: Integrantes
    type: file
    path: content/integrantes.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: role
        label: Rol
        description: Por ejemplo "Coordinadora de Talleres".
        type: string
        required: true
      - name: bio
        label: Biografía
        type: text
      - name: image
        label: Foto
        description: Se muestra en blanco y negro.
        type: image

  - name: redes
    label: Redes sociales
    description: Redes del Centro Cultural. Se muestran en /redes y en el pie de página. La radio tiene sus propias redes.
    type: file
    path: content/redes.json
    format: json
    list: true
    fields:
      - name: network
        label: Red
        description: Define el ícono.
        type: select
        required: true
        options:
          values:
            - { value: instagram, label: Instagram }
            - { value: youtube, label: YouTube }
            - { value: facebook, label: Facebook }
            - { value: x, label: X / Twitter }
            - { value: whatsapp, label: WhatsApp }
            - { value: spotify, label: Spotify }
            - { value: web, label: Otro sitio web }
      - name: name
        label: Nombre visible
        type: string
        required: true
      - name: handle
        label: Usuario
        description: Por ejemplo "@cccelbondi".
        type: string
      - name: description
        label: Descripción
        description: Se muestra en la tarjeta de /redes.
        type: text
      - name: href
        label: Enlace
        description: URL completa, empezando con https://
        type: string
        required: true
      - name: cta
        label: Texto del botón
        description: Por ejemplo "Seguir en Instagram".
        type: string

  - name: radio
    label: Radio Activa
    description: Contenido de la sección de radio en el inicio y de la página /radio-espacio.
    type: file
    path: content/radio.json
    format: json
    fields:
      - name: name
        label: Nombre de la radio
        type: string
        required: true
      - name: frequency
        label: Frecuencia
        description: Por ejemplo "96.9".
        type: string
        required: true
      - name: listenUrl
        label: Enlace para escuchar en vivo
        description: URL completa, empezando con https://
        type: string
        required: true
      - name: home
        label: Sección en el inicio
        type: object
        fields:
          - name: image
            label: Imagen
            type: image
            required: true
          - name: imageAlt
            label: Texto alternativo de la imagen
            type: string
            required: true
          - name: description
            label: Descripción
            type: text
            required: true
          - name: cta
            label: Texto del botón
            type: string
            required: true
            default: Escuchar en vivo
      - name: heroDescription
        label: Bajada de la página
        description: Se muestra debajo del título en /radio-espacio.
        type: text
        required: true
      - name: heroCta
        label: Texto del botón principal
        type: string
        required: true
        default: Escuchar en Vivo
      - name: aboutTitle
        label: Título de "Quiénes somos"
        type: string
        required: true
        default: Quienes Somos
      - name: about
        label: Párrafos de "Quiénes somos"
        type: text
        list: true
      - name: mission
        label: Nuestra misión
        type: text
      - name: values
        label: Nuestros valores
        type: string
        list: true
      - name: contact
        label: Contacto
        type: object
        fields:
          - name: address
            label: Dirección
            type: string
          - name: phone
            label: Teléfono
            type: string
          - name: email
            label: Email
            type: string
      - name: socials
        label: Redes de la radio
        type: object
        list: true
        fields:
          - name: network
            label: Red
            description: Define el ícono.
            type: select
            required: true
            options:
              values:
                - { value: instagram, label: Instagram }
                - { value: facebook, label: Facebook }
                - { value: youtube, label: YouTube }
                - { value: x, label: X / Twitter }
                - { value: whatsapp, label: WhatsApp }
                - { value: spotify, label: Spotify }
                - { value: app, label: App / descarga }
                - { value: web, label: Otro sitio web }
          - name: name
            label: Nombre visible
            type: string
            required: true
          - name: handle
            label: Usuario o detalle
            description: Por ejemplo "@fmradioactiva96.9".
            type: string
          - name: href
            label: Enlace
            description: URL completa, empezando con https://
            type: string
            required: true
      - name: galleryTitle
        label: Título de la galería
        type: string
        default: La Radio en Imagenes
      - name: galleryDescription
        label: Bajada de la galería
        type: text
      - name: gallery
        label: Galería de fotos
        type: object
        list: true
        fields:
          - name: src
            label: Foto
            type: image
            required: true
          - name: alt
            label: Descripción de la foto
            description: Se muestra al pasar el mouse y la leen los lectores de pantalla.
            type: string
            required: true
      - name: ctaSection
        label: Bloque final "Escuchá en vivo"
        type: object
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: description
            label: Texto
            type: text
          - name: cta
            label: Texto del botón
            type: string
            required: true
            default: Ir a radioactiva.ar
